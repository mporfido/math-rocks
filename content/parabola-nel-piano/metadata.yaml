title: La parabola nel piano cartesiano
description: >-
  I punti che stanno alla stessa distanza da un punto e da una retta formano una
  curva. Dalla sua definizione si ricava l'equazione, e dall'equazione si
  ritrovano il fuoco e la direttrice.
level: intermediate
duration: 45 minuti
color: "#00838F"
# L'ordine consigliato è quello dell'elenco, ma le lezioni si aprono tutte
progression: free
