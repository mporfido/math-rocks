# Configurazione del sito (istanza) — modificabile senza toccare il codice.
#
# Precedenza: variabile d'ambiente > questo file > default neutro dell'engine.
# Le chiavi commentate sono opzionali.

site_name: Math Rocks
site_title: Benvenuti ai Corsi Interattivi di Matematica
site_subtitle: Lezioni di matematica interattive e coinvolgenti
footer_text: Prof. Michele Porfido

# Lingua del sito (attributo lang dell'HTML)
language: it

# Corsi di matematica per default: attiva MathJax e l'auto-conversione dei
# backtick matematici (`x = 5` → formula). Override per singolo corso con
# `math: true|false` nel suo metadata.yaml.
math: true

# Prefisso delle chiavi localStorage (progressi degli studenti nel browser).
# NON cambiarlo a sito pubblicato: i progressi salvati verrebbero "persi"
# (restano su disco ma sotto le vecchie chiavi).
storage_prefix: mathrocks

# Tema: file CSS (in static/) con i design token dell'istanza.
# theme_file: theme.css          # default, opzionale
theme_color: "#FBFBF6"           # colore barra del browser (meta theme-color)

# Font da precaricare (pesi visibili above-the-fold, path relativi a static/)
preload_fonts:
  - fonts/space-grotesk-700.woff2
  - fonts/ibm-plex-serif-400.woff2
