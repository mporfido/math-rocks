<!DOCTYPE html>
<!-- PROTOTIPO di riferimento da cui nasce DIMOSTRAZIONI.md, non codice di produzione -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costruire una dimostrazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --carta:#EDEEE8;
  --carta-alta:#FAFAF6;
  --inchiostro:#1B2A33;
  --smorto:#5E6D75;
  --blu:#26518A;
  --rosso:#A32E22;
  --verde:#2C6650;
  --linea:#C7CAC0;
  --quadretto:#D9DCD1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--carta);
  background-image:
    repeating-linear-gradient(to right, var(--quadretto) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(to bottom, var(--quadretto) 0 1px, transparent 1px 24px);
  color:var(--inchiostro);
  font-family:Archivo, system-ui, sans-serif;
  font-size:15px;
  line-height:1.55;
}
.foglio{max-width:1060px;margin:0 auto;padding:32px 20px 72px}

header{border-bottom:2px solid var(--inchiostro);padding-bottom:18px;margin-bottom:22px}
.occhiello{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--smorto);font-weight:600;margin:0 0 6px
}
h1{
  font-family:Spectral, Georgia, serif;font-weight:500;
  font-size:clamp(22px,3.4vw,31px);line-height:1.25;margin:0 0 14px;max-width:26em
}
.dati{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:14px}
.dati div{max-width:34em}
.dati b{font-weight:600;color:var(--smorto);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:block}
.dati span{font-family:Spectral,Georgia,serif}

nav{display:flex;flex-wrap:wrap;gap:0;margin-bottom:14px;border:1px solid var(--inchiostro);width:max-content;max-width:100%}
nav button{
  font:inherit;font-size:13px;font-weight:500;padding:8px 15px;
  background:transparent;border:0;border-right:1px solid var(--inchiostro);
  color:var(--inchiostro);cursor:pointer
}
nav button:last-child{border-right:0}
nav button[aria-pressed="true"]{background:var(--inchiostro);color:var(--carta-alta)}
nav button:hover:not([aria-pressed="true"]){background:#DEE0D8}
.consegna{font-family:Spectral,Georgia,serif;font-size:16px;color:var(--smorto);margin:0 0 26px;max-width:52em}

main{display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}

.titoletto{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--smorto);margin:0 0 10px}
aside svg{width:100%;height:auto;display:block;margin-bottom:26px}

.attrezzi{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--linea);border:1px solid var(--linea)}
.attrezzi li{background:var(--carta-alta);padding:9px 12px;font-size:13px;line-height:1.4}
.attrezzi li b{display:block;font-weight:600;font-size:12px;color:var(--blu)}
.attrezzi li span{color:var(--smorto)}

.catena{position:relative;padding-left:46px;min-height:60px;margin-bottom:26px}
.catena svg.fili{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.riga{
  position:relative;background:var(--carta-alta);border:1px solid var(--linea);
  border-left:3px solid var(--blu);padding:10px 12px;margin-bottom:8px;
  display:flex;gap:12px;align-items:flex-start
}
.riga.ipotesi{border-left-color:var(--smorto)}
.riga.tesi{border-left-color:var(--verde)}
.riga.sbagliata{border-left-color:var(--rosso);background:#FBF0EE}
.riga .n{font-size:11px;font-weight:600;color:var(--smorto);min-width:16px;padding-top:3px}
.riga .corpo{flex:1;min-width:0}
.riga .testo{font-family:Spectral,Georgia,serif;font-size:16px}
.riga .perche{font-size:12.5px;color:var(--smorto);margin-top:3px}
.riga .perche b{color:var(--blu);font-weight:500}
.riga select{font:inherit;font-size:12.5px;margin-top:5px;max-width:100%;padding:3px 5px;border:1px solid var(--linea);background:var(--carta);color:var(--inchiostro)}
.riga .comandi{display:flex;flex-direction:column;gap:2px}
.riga .comandi button{
  font:inherit;font-size:12px;line-height:1;width:22px;height:20px;padding:0;
  border:1px solid var(--linea);background:var(--carta);color:var(--smorto);cursor:pointer
}
.riga .comandi button:hover{color:var(--inchiostro);border-color:var(--inchiostro)}
.riga.evidenzia{background:#EAF0F7;border-color:var(--blu)}

.banco{border-top:1px dashed var(--linea);padding-top:16px;margin-bottom:22px}
.banco .lista{display:flex;flex-wrap:wrap;gap:8px}
.cartellino{
  font:inherit;text-align:left;background:var(--carta-alta);border:1px solid var(--linea);
  border-bottom-width:3px;padding:9px 12px;cursor:pointer;max-width:100%;color:var(--inchiostro)
}
.cartellino:hover{border-color:var(--blu);background:#fff}
.cartellino .testo{font-family:Spectral,Georgia,serif;font-size:15px;display:block}
.cartellino .perche{font-size:12px;color:var(--smorto);display:block;margin-top:2px}
.vuoto{font-size:13px;color:var(--smorto);font-style:italic}

.azioni{display:flex;gap:10px;flex-wrap:wrap}
.azioni button{font:inherit;font-size:14px;font-weight:500;padding:9px 18px;cursor:pointer;border:1px solid var(--inchiostro)}
.primario{background:var(--inchiostro);color:var(--carta-alta)}
.secondario{background:transparent;color:var(--inchiostro)}
.azioni button:hover{opacity:.85}

.esito{margin-top:16px;padding:12px 14px;border-left:3px solid;font-size:14.5px;display:none}
.esito.ok{display:block;border-color:var(--verde);background:#EAF2EE;color:var(--verde)}
.esito.no{display:block;border-color:var(--rosso);background:#FAEFED;color:var(--rosso)}

:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){
  .riga,.cartellino{transition:background .15s,border-color .15s}
}
</style>
</head>
<body>
<div class="foglio">

<header>
  <p class="occhiello">Teorema</p>
  <h1>In un parallelogramma le diagonali si tagliano scambievolmente per metà.</h1>
  <div class="dati">
    <div><b>Ipotesi</b><span>ABCD è un parallelogramma. Le diagonali AC e BD si incontrano in M.</span></div>
    <div><b>Tesi</b><span>AM ≅ MC e BM ≅ MD</span></div>
  </div>
</header>

<nav id="livelli" aria-label="Livelli"></nav>
<p class="consegna" id="consegna"></p>

<main>
  <aside>
    <p class="titoletto">Figura</p>
    <svg viewBox="0 0 340 210" role="img" aria-label="Parallelogramma ABCD con le diagonali AC e BD che si incontrano in M">
      <polygon points="40,165 150,55 300,55 190,165" fill="#FAFAF6" stroke="#1B2A33" stroke-width="1.6"/>
      <line x1="40" y1="165" x2="300" y2="55" stroke="#26518A" stroke-width="1.2" stroke-dasharray="5 4"/>
      <line x1="150" y1="55" x2="190" y2="165" stroke="#26518A" stroke-width="1.2" stroke-dasharray="5 4"/>
      <circle cx="170" cy="110" r="3.4" fill="#26518A"/>
      <g font-family="Spectral, Georgia, serif" font-size="15" fill="#1B2A33">
        <text x="26" y="180">A</text>
        <text x="145" y="46">B</text>
        <text x="304" y="46">C</text>
        <text x="192" y="181">D</text>
        <text x="176" y="103" fill="#26518A">M</text>
      </g>
    </svg>
    <p class="titoletto">Cassetta degli attrezzi</p>
    <ul class="attrezzi" id="attrezzi"></ul>
  </aside>

  <section>
    <p class="titoletto">La dimostrazione</p>
    <div class="catena" id="catena"></div>

    <div class="banco" id="banco">
      <p class="titoletto">Cartellini da collocare</p>
      <div class="lista" id="lista-banco"></div>
    </div>

    <div class="azioni">
      <button class="primario" id="verifica">Verifica</button>
      <button class="secondario" id="ricomincia">Ricomincia</button>
    </div>
    <div class="esito" id="esito" role="status"></div>
  </section>
</main>
</div>

<script>
// ---------------------------------------------------------------------------
// 1. LA TEORIA DISPONIBILE  (Mariotti: un teorema vive dentro una teoria)
// ---------------------------------------------------------------------------
const TEORIA = {
  'def-par':   { nome:'Definizione di parallelogramma', testo:'ha i lati opposti paralleli' },
  'lati-opp':  { nome:'Lati opposti',      testo:'in un parallelogramma i lati opposti sono congruenti' },
  'alt-int':   { nome:'Angoli alterni interni', testo:'due parallele tagliate da una trasversale formano angoli alterni interni congruenti' },
  'crit2':     { nome:'Secondo criterio',  testo:'un lato e i due angoli adiacenti congruenti' },
  'corr':      { nome:'Elementi corrispondenti', testo:'in triangoli congruenti gli elementi corrispondenti sono congruenti' },
  'ang-opp':   { nome:'Angoli opposti',    testo:'in un parallelogramma gli angoli opposti sono congruenti' },
  'crit1':     { nome:'Primo criterio',    testo:'due lati e l\u2019angolo tra essi compreso congruenti' },
  'diag-rett': { nome:'Diagonali del rettangolo', testo:'in un rettangolo le diagonali sono congruenti' }
};

// ---------------------------------------------------------------------------
// 2. LA DIMOSTRAZIONE COMPLETA  (un passo = premesse + garanzia + conclusione)
//    Questa è l'unica cosa che scrivi. Tutti i livelli nascono da qui.
// ---------------------------------------------------------------------------
const PASSI = {
  p0:{ testo:'ABCD \u00e8 un parallelogramma e le diagonali AC e BD si incontrano in M.',
       statuto:'ipotesi', premesse:[], garanzia:null },
  p1:{ testo:'AB \u00e8 parallelo a DC.',
       statuto:'dedotto', premesse:['p0'], garanzia:'def-par' },
  p2:{ testo:'AB \u2245 DC.',
       statuto:'dedotto', premesse:['p0'], garanzia:'lati-opp' },
  p3:{ testo:'L\u2019angolo BAM \u2245 l\u2019angolo DCM.',
       statuto:'dedotto', premesse:['p1'], garanzia:'alt-int' },
  p4:{ testo:'L\u2019angolo ABM \u2245 l\u2019angolo CDM.',
       statuto:'dedotto', premesse:['p1'], garanzia:'alt-int' },
  p5:{ testo:'Il triangolo ABM \u2245 il triangolo CDM.',
       statuto:'dedotto', premesse:['p2','p3','p4'], garanzia:'crit2' },
  p6:{ testo:'AM \u2245 CM e BM \u2245 DM.',
       statuto:'tesi', premesse:['p5'], garanzia:'corr' }
};
const ORDINE = ['p0','p1','p2','p3','p4','p5','p6'];

// Cartellini che NON servono: uno vero ma inutile, uno con la garanzia sbagliata,
// uno falso. Sono i più istruttivi.
const DISTRATTORI = {
  d1:{ testo:'L\u2019angolo BAD \u2245 l\u2019angolo BCD.', garanzia:'ang-opp' },
  d2:{ testo:'Il triangolo ABM \u2245 il triangolo CDM.', garanzia:'crit1' },
  d3:{ testo:'AC \u2245 BD.', garanzia:'diag-rett' }
};

// ---------------------------------------------------------------------------
// 3. I LIVELLI = maschere sulla stessa struttura
// ---------------------------------------------------------------------------
const LIVELLI = [
  { nome:'Leggi', consegna:'La dimostrazione \u00e8 gi\u00e0 fatta. Clicca un passo per vedere da quali passi precedenti nasce.',
    partenza:ORDINE, garanzieVisibili:true, distrattori:[], soloLettura:true },
  { nome:'Ordina', consegna:'Ci sono tutti i passi, ma sono mescolati. Rimettili in un ordine che funzioni: ogni passo deve venire dopo quelli che usa.',
    partenza:['p0'], garanzieVisibili:true, distrattori:[] },
  { nome:'Giustifica', consegna:'L\u2019ordine \u00e8 gi\u00e0 dato. Per ogni passo scegli dalla cassetta degli attrezzi il teorema che ti autorizza a farlo.',
    partenza:ORDINE, garanzieVisibili:false, distrattori:[] },
  { nome:'Completa', consegna:'Mancano due passi. Nel mucchio ci sono anche cartellini che non servono: uno \u00e8 vero ma inutile, uno ha la giustificazione sbagliata, uno \u00e8 falso.',
    partenza:['p0','p1','p2','p4','p6'], garanzieVisibili:true, distrattori:['d1','d2','d3'] },
  { nome:'Costruisci', consegna:'Hai solo l\u2019ipotesi. Costruisci tutta la catena fino alla tesi e giustifica ogni passo.',
    partenza:['p0'], garanzieVisibili:false, distrattori:['d1','d2','d3'] }
];

// ---------------------------------------------------------------------------
// 4. STATO E RENDER
// ---------------------------------------------------------------------------
let stato = { liv:0, catena:[], banco:[], scelte:{}, evidenziato:null, errori:[] };

function mescola(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function etichetta(id){ return PASSI[id] || DISTRATTORI[id]; }

function caricaLivello(n){
  const L = LIVELLI[n];
  const restanti = ORDINE.filter(id => !L.partenza.includes(id));
  stato = {
    liv:n,
    catena: L.partenza.slice(),
    banco: mescola(restanti.concat(L.distrattori)),
    scelte: {},
    evidenziato: null,
    errori: []
  };
  if (L.garanzieVisibili) ORDINE.forEach(id => { if(PASSI[id].garanzia) stato.scelte[id]=PASSI[id].garanzia; });
  document.getElementById('consegna').textContent = L.consegna;
  document.getElementById('banco').style.display = L.soloLettura ? 'none' : '';
  document.getElementById('verifica').style.display = L.soloLettura ? 'none' : '';
  document.getElementById('esito').className = 'esito';
  render();
}

function render(){
  const L = LIVELLI[stato.liv];
  const cat = document.getElementById('catena');
  cat.innerHTML = '<svg class="fili" aria-hidden="true"></svg>';

  stato.catena.forEach((id,i)=>{
    const p = etichetta(id);
    const riga = document.createElement('div');
    riga.className = 'riga';
    if (p.statuto==='ipotesi') riga.classList.add('ipotesi');
    if (p.statuto==='tesi')    riga.classList.add('tesi');
    if (stato.errori.includes(i)) riga.classList.add('sbagliata');
    if (stato.evidenziato!==null && (stato.evidenziato===i ||
        (PASSI[stato.catena[stato.evidenziato]]||{premesse:[]}).premesse.includes(id)))
      riga.classList.add('evidenzia');
    riga.dataset.pos = i;

    let perche = '';
    if (p.statuto==='ipotesi') {
      perche = '<div class="perche">per ipotesi</div>';
    } else if (L.garanzieVisibili) {
      perche = '<div class="perche">perch\u00e9 <b>' + TEORIA[p.garanzia].nome + '</b>: ' + TEORIA[p.garanzia].testo + '</div>';
    } else {
      const opts = Object.keys(TEORIA).map(k =>
        '<option value="'+k+'"'+(stato.scelte[id]===k?' selected':'')+'>'+TEORIA[k].nome+'</option>').join('');
      perche = '<select data-id="'+id+'"><option value="">scegli il teorema\u2026</option>'+opts+'</select>';
    }

    let comandi = '';
    if (!L.soloLettura && !L.partenza.includes(id)) {
      comandi = '<div class="comandi">'
        + '<button data-az="su" data-pos="'+i+'" aria-label="Sposta su">\u2191</button>'
        + '<button data-az="giu" data-pos="'+i+'" aria-label="Sposta gi\u00f9">\u2193</button>'
        + '<button data-az="via" data-pos="'+i+'" aria-label="Togli">\u00d7</button></div>';
    }

    riga.innerHTML = '<span class="n">'+(i+1)+'</span><div class="corpo">'
      + '<div class="testo">'+p.testo+'</div>'+perche+'</div>'+comandi;
    cat.appendChild(riga);
  });

  const lista = document.getElementById('lista-banco');
  lista.innerHTML = '';
  if (!stato.banco.length) lista.innerHTML = '<p class="vuoto">Nessun cartellino rimasto.</p>';
  stato.banco.forEach(id=>{
    const p = etichetta(id);
    const b = document.createElement('button');
    b.className = 'cartellino';
    b.dataset.aggiungi = id;
    b.innerHTML = '<span class="testo">'+p.testo+'</span>'
      + (L.garanzieVisibili && p.garanzia ? '<span class="perche">'+TEORIA[p.garanzia].nome+'</span>' : '');
    lista.appendChild(b);
  });

  disegnaFili();
}

// Il "filo" che collega un passo alle sue premesse: la dimostrazione si vede
// diventare un grafo, non una lista.
function disegnaFili(){
  const cat = document.getElementById('catena');
  const svg = cat.querySelector('svg.fili');
  const base = cat.getBoundingClientRect();
  const centri = {};
  cat.querySelectorAll('.riga').forEach(r=>{
    const b = r.getBoundingClientRect();
    centri[stato.catena[+r.dataset.pos]] = { y: b.top - base.top + b.height/2, pos:+r.dataset.pos };
  });
  let d = '';
  stato.catena.forEach((id,i)=>{
    const p = PASSI[id]; if(!p) return;
    p.premesse.forEach(pr=>{
      const a = centri[pr], b = centri[id];
      if(!a || !b) return;
      const rosso = a.pos > b.pos;
      d += '<path d="M40 '+b.y+' C 12 '+b.y+', 12 '+a.y+', 40 '+a.y+'" fill="none" stroke="'
        + (rosso ? '#A32E22' : '#26518A') + '" stroke-width="'+(rosso?1.6:1)+'" opacity="'+(rosso?1:.55)+'"/>'
        + '<circle cx="40" cy="'+a.y+'" r="2.4" fill="'+(rosso?'#A32E22':'#26518A')+'"/>';
    });
  });
  svg.innerHTML = d;
}

// ---------------------------------------------------------------------------
// 5. CORREZIONE: un ordine è valido se ogni passo viene dopo le sue premesse.
//    Non si confronta con "la" soluzione: le soluzioni giuste sono tante.
// ---------------------------------------------------------------------------
function verifica(){
  const L = LIVELLI[stato.liv];
  stato.errori = [];
  const esito = document.getElementById('esito');
  const dice = (cls,txt)=>{ esito.className='esito '+cls; esito.innerHTML=txt; render(); };

  const intrusi = stato.catena.filter(id=>DISTRATTORI[id]);
  if (intrusi.length){
    stato.errori = intrusi.map(id=>stato.catena.indexOf(id));
    return dice('no','Il passo '+(stato.errori[0]+1)+' non ti serve, oppure non \u00e8 giustificato da un teorema che puoi usare qui. Rileggilo con attenzione.');
  }

  const mancanti = ORDINE.filter(id=>!stato.catena.includes(id));
  if (mancanti.length) return dice('no','La catena non arriva ancora fino in fondo: manca ancora qualche passaggio.');

  for (let i=0;i<stato.catena.length;i++){
    const p = PASSI[stato.catena[i]];
    const fuori = p.premesse.some(pr=>stato.catena.indexOf(pr) >= i);
    if (fuori){ stato.errori=[i]; return dice('no','Il passo '+(i+1)+' usa qualcosa che a quel punto non hai ancora. Guarda il filo rosso a sinistra.'); }
  }

  if (!L.garanzieVisibili){
    for (let i=0;i<stato.catena.length;i++){
      const id = stato.catena[i], p = PASSI[id];
      if (p.garanzia && stato.scelte[id] !== p.garanzia){
        stato.errori=[i];
        return dice('no','L\u2019ordine \u00e8 giusto, ma la giustificazione del passo '+(i+1)+' non regge.');
      }
    }
  }
  dice('ok','Dimostrazione corretta. Ogni passo poggia su qualcosa che avevi gi\u00e0.');
}

// ---------------------------------------------------------------------------
// 6. EVENTI
// ---------------------------------------------------------------------------
const nav = document.getElementById('livelli');
LIVELLI.forEach((L,i)=>{
  const b = document.createElement('button');
  b.textContent = (i+1)+'. '+L.nome;
  b.setAttribute('aria-pressed', i===0);
  b.onclick = ()=>{ [...nav.children].forEach((c,j)=>c.setAttribute('aria-pressed', j===i)); caricaLivello(i); };
  nav.appendChild(b);
});

const attr = document.getElementById('attrezzi');
Object.values(TEORIA).forEach(t=>{
  const li = document.createElement('li');
  li.innerHTML = '<b>'+t.nome+'</b><span>'+t.testo+'</span>';
  attr.appendChild(li);
});

document.getElementById('catena').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-az]');
  if (btn){
    const i = +btn.dataset.pos, az = btn.dataset.az;
    if (az==='via'){ stato.banco.push(stato.catena.splice(i,1)[0]); }
    if (az==='su' && i>0){ [stato.catena[i-1],stato.catena[i]]=[stato.catena[i],stato.catena[i-1]]; }
    if (az==='giu' && i<stato.catena.length-1){ [stato.catena[i+1],stato.catena[i]]=[stato.catena[i],stato.catena[i+1]]; }
    stato.errori=[]; return render();
  }
  const riga = e.target.closest('.riga');
  if (riga && LIVELLI[stato.liv].soloLettura){
    const i = +riga.dataset.pos;
    stato.evidenziato = (stato.evidenziato===i) ? null : i;
    render();
  }
});

document.getElementById('catena').addEventListener('change', e=>{
  if (e.target.matches('select')) stato.scelte[e.target.dataset.id] = e.target.value;
});

document.getElementById('lista-banco').addEventListener('click', e=>{
  const b = e.target.closest('[data-aggiungi]');
  if (!b) return;
  const id = b.dataset.aggiungi;
  stato.banco.splice(stato.banco.indexOf(id),1);
  stato.catena.push(id);
  stato.errori=[];
  document.getElementById('esito').className='esito';
  render();
});

document.getElementById('verifica').onclick = verifica;
document.getElementById('ricomincia').onclick = ()=>caricaLivello(stato.liv);
window.addEventListener('resize', disegnaFili);

caricaLivello(0);
</script>
</body>
</html>
