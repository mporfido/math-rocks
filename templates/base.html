<!DOCTYPE html>
<html lang="{{ site_language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>

    <meta name="theme-color" content="{{ theme_color }}">
    <!-- Prefisso localStorage per i progressi: letto da progress.js -->
    <meta name="x-storage-prefix" content="{{ storage_prefix }}">

    <!-- Font above-the-fold: preload dei pesi visibili subito (da site.yaml) -->
    {% for font in preload_fonts %}
    <link rel="preload" href="{{ url_for('static', filename=font) }}" as="font" type="font/woff2" crossorigin>
    {% endfor %}

    <!-- CSS engine (strutturale) prima, tema di istanza dopo: i token del
         tema vincono sul fallback neutro di style.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename=theme_file) }}">

    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="main-header">
        <nav class="navbar">
            <a href="{{ url_for('home') }}" class="logo"><span class="logo-mark" aria-hidden="true">✓</span>{{ site_name }}</a>
            <div class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                {% if has_tools %}<a href="{{ url_for('tools.tools_index') }}">Strumenti</a>{% endif %}
            </div>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="main-footer">
        <p>{{ footer_text }} &copy; {{ current_year }}</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
