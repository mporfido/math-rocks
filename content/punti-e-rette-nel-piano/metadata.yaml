title: Punti e rette nel piano cartesiano
description: >-
  Due punti scritti come coppie di numeri: da lì si ricava quanto distano, chi
  sta esattamente in mezzo e l'equazione della retta che passa per entrambi,
  senza mai misurare con il righello.
level: beginner
duration: 50 minuti
color: "#00838F"
# L'ordine consigliato è quello dell'elenco, ma le lezioni si aprono tutte
progression: free